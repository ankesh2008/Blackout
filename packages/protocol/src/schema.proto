syntax = "proto3";

package blackout.protocol;

enum SeverityLevel {
  SEVERITY_UNKNOWN = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
  SEVERITY_CRITICAL = 4;
}

enum IncidentCategory {
  CATEGORY_GENERAL = 0;
  CATEGORY_MEDICAL = 1;
  CATEGORY_FIRE = 2;
  CATEGORY_SEARCH_AND_RESCUE = 3;
  CATEGORY_INFRASTRUCTURE = 4;
  CATEGORY_HAZARD = 5;
  CATEGORY_RESOURCE_NEED = 6;
}

enum ReportStatus {
  STATUS_SUBMITTED = 0;
  STATUS_TRIAGED = 1;
  STATUS_DISPATCHED = 2;
  STATUS_RESOLVED = 3;
}

message GeoCoordinates {
  double latitude = 1;
  double longitude = 2;
  float altitude = 3;
  float accuracy = 4;
}

message VectorClockEntry {
  string node_id = 1;
  uint64 counter = 2;
}

message EmergencyReport {
  string id = 1;
  string title = 2;
  string description = 3;
  SeverityLevel severity = 4;
  IncidentCategory category = 5;
  ReportStatus status = 6;
  GeoCoordinates location = 7;
  string reporter_id = 8;
  string callsign = 9;
  uint32 casualties_count = 10;
  uint32 trapped_count = 11;
  repeated string resources_needed = 12;
  uint64 created_at = 13;
  uint64 updated_at = 14;
  uint32 version = 15;
  repeated VectorClockEntry vector_clock = 16;
  bool deleted = 17;
}

message MeshPacket {
  string message_id = 1;
  string sender_node_id = 2;
  string sender_callsign = 3;
  string target_node_id = 4; // empty for broadcast
  uint64 timestamp = 5;
  string message_type = 6;
  bytes payload = 7;
  bytes signature = 8;
}

message SyncBatchOffer {
  string batch_id = 1;
  string sender_node_id = 2;
  repeated VectorClockEntry state_vector = 3;
  repeated EmergencyReport reports = 4;
}
